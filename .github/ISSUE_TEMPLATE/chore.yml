name: "CHORE — mechanical maintenance"
description: "Mechanical maintenance; minimal ceremony"
# nadal's taxonomy, not deuce's — declared drift against the vendoring receipt (#146). nadal has no
# `chore` type: mechanical maintenance is a `task` here, and the title prefix has to say the same
# thing as the label. A `CHORE:` title carrying a `task` label would break the one rule labels.yml
# states — that every issue's type is BOTH its uppercase prefix and its label — which is what this
# template would otherwise have made false on its own repository. The form's name and prompts still
# describe chore-shaped work; only the type it files under is nadal's.
title: "TASK: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "Title rule: plain-language imperative a human understands with zero context. Add exactly one area: label after creating."
  - type: textarea
    id: summary
    attributes:
      label: "Summary (HC)"
      description: "Non-technical, bulleted, no jargon: what needs doing, why it matters, what done looks like"
    validations: {required: true}
  - type: textarea
    id: technical
    attributes:
      label: "Technical detail (HC+AC)"
      description: "Optional. As deep as the work needs; still bulleted."
    validations: {required: false}
  - type: input
    id: part_of
    attributes:
      label: "Part of"
      description: "Parent epic, as 'Part of #N' — never a closing keyword"
    validations: {required: false}
