name: ci

# One gate, one command, local and CI. This workflow no longer carries its own list of checks: it
# runs `npm run gate`, which executes exactly what `config/checks.md` declares, in the order
# declared (#146). Before this, `config/checks.md` did not exist and three hand-maintained lists —
# PROJECT.md's Quality Checks table, this file's steps, and a comment block mapping one to the other
# — agreed only by convention. Two of the three are now pointers.
#
# Add or remove a check in `config/checks.md`. There is no second place to edit, and nothing here
# needs to change when the gate's contents do.
#
# The ace-era structural parity check (parity.yml + scripts/parity_check.rb) retired with the deuce
# cutover (deuce #86): the vendoring receipt's checksums are the drift mechanism now, so there is no
# parity job anywhere and none is missing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exit 1 means a check ran and failed; exit 2 means the gate could not run at all (a missing
      # prerequisite, an unreadable declaration). Both fail the job, and the gate's own output says
      # which — see docs/runbooks/quality-gate.md.
      - run: npm run gate
