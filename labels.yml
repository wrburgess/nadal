# nadal's label set — the labels this tracker actually USES.
#
# Scope, stated because the previous version of this file over-claimed and the correction is cheap:
# GitHub's eight stock labels (documentation, duplicate, enhancement, good first issue, help wanted,
# invalid, question, wontfix) still exist on the repository and are simply never applied. They are
# not listed below. This file enumerates the working vocabulary, not every label the API would return.
#
# Rewritten on #146. What stood here before was deuce's three-axis schema (type: / status: / area:),
# and NONE of its 17 names existed on this repository: measured at that issue, 0 of 17. nadal has run
# a flat set across 73 issues and 79 pull requests since long before the deuce cutover, so the file
# described a taxonomy nobody used while the real one was undeclared.
#
# The divergence from deuce's schema, stated rather than silently taken:
#
#   * FLAT, NOT AXES. deuce asks for exactly one label per axis. nadal carries one TYPE label and,
#     optionally, one lifecycle marker. There is no status: axis at all — issue state, PR state and
#     the posted lifecycle artifacts already say where a thing is, and a hand-maintained status label
#     is a fourth place to forget to update.
#   * DIFFERENT TYPES. deuce's set is epic/task/bug/spike/chore. nadal's is
#     epic/phase/feature/task/bug/optimization. `feature` is the difference that matters -- most work
#     here is user-facing capability, and calling it `task` loses the distinction the tracker is read
#     for. `spike` and `chore` have no nadal equivalent: research folds into an issue's Assessment,
#     and mechanical maintenance is a `task`.
#   * TITLE PREFIX AS WELL AS LABEL. Every issue carries its type as BOTH an uppercase title prefix
#     (`BUG:`, `FEATURE:`) and the matching label. The prefix is what makes `gh issue list` readable;
#     the label is what makes it filterable.
#
# NOTHING PARSES THIS FILE. It is hand-synced, and it is documentation of the tracker rather than a
# source the tracker is generated from. Deliberately not given a shape test on #146: a check over a
# file nothing consumes certifies an invariant it cannot see, which is a lesson this repository has
# already paid for. What DOES read a label set is `.github/ISSUE_TEMPLATE/*.yml`, whose `labels:`
# lists were corrected to this set on the same issue -- they had been assigning deuce's `type:*` and
# `status:ready`, none of which exist here, so every templated issue silently lost its labels.

# One per issue, always — as a label and as an uppercase title prefix.
type:
  - {name: "epic",         color: "5319E7", description: "Umbrella issue tracking a multi-PR body of work"}
  - {name: "phase",        color: "C5DEF5", description: "A planned phase of work from the wayfinder map"}
  - {name: "feature",      color: "0E8A16", description: "New user-facing capability"}
  - {name: "task",         color: "BFDADC", description: "A discrete chore: docs, config, tooling, or process plumbing"}
  - {name: "bug",          color: "d73a4a", description: "Something is actually wrong: incorrect output, data loss, or a guard that fails open — fix it"}
  - {name: "optimization", color: "FBCA04", description: "Works correctly but could be faster, tidier, or cheaper — triage, do not fold into a running PR"}

# Optional, and each says something the type label cannot.
lifecycle:
  - {name: "docket",   color: "c5def5", description: "Promoted from the findings log at a triage pass"}
  - {name: "residual", color: "e4e669", description: "Accepted limitation, decided against on the record - do not re-litigate"}

# The wayfinder map's own stages (#13). Scoped to that epic; not part of the type set.
wayfinder:
  - {name: "wayfinder:map",       color: "FEF2C0", description: "The map issue itself"}
  - {name: "wayfinder:grilling",  color: "C2E0C6", description: "Requirements being stress-tested with the HC"}
  - {name: "wayfinder:research",  color: "0E8A16", description: "Open question feeding a decision"}
  - {name: "wayfinder:prototype", color: "FEF2C0", description: "Throwaway build to answer a question"}
  - {name: "wayfinder:task",      color: "5319E7", description: "Ready to enter the lifecycle"}

# Applied by tooling, not by hand.
automation:
  - {name: "dependencies", color: "0366d6", description: "Pull requests that update a dependency file"}
  - {name: "javascript",   color: "168700", description: "Pull requests that update javascript code"}
